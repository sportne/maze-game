name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Fetch PMD submodule tags
        run: git -C tools/pmd fetch --tags --force origin

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Install Playwright system dependencies
        run: ./gradlew :modules:browser-tests:playwrightInstallDependencies

      - name: Build and verify static site
        run: ./gradlew qualityGate pagesBuild

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: modules/teavm/build/dist/pages

  deploy:
    name: Deploy static site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  safari:
    name: Validate deployed site in Safari
    needs: deploy
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Enable Safari WebDriver
        run: |
          safaridriver --version
          sudo safaridriver --enable

      - name: Validate live release in Safari
        run: >-
          ./gradlew :modules:browser-tests:safariReleaseTest
          -DmazeGame.safariReleaseUrl="${{ needs.deploy.outputs.page_url }}"
          -DmazeGame.safariWasmReleaseUrl="${{ needs.deploy.outputs.page_url }}wasm/"

      - name: Upload Safari release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-release-evidence
          path: modules/browser-tests/build/reports/safari-release
          if-no-files-found: error
