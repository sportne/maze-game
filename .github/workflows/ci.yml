name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Quality gate, browser artifacts, and native image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: "21"
          cache: gradle

      - name: Fetch PMD submodule tags
        run: git -C tools/pmd fetch --tags --force origin

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Install Playwright system dependencies
        run: ./gradlew :modules:browser-tests:playwrightInstallDependencies

      - name: Run quality gate, browser builds, and native image build
        run: ./gradlew qualityGate pagesBuild nativeImage

      - name: Upload static website
        uses: actions/upload-artifact@v4
        with:
          name: maze-game-static-site
          path: modules/teavm/build/dist/pages
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload WebAssembly preview
        uses: actions/upload-artifact@v4
        with:
          name: maze-game-webassembly-preview
          path: modules/teavm/build/dist/wasm/webapp
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload browser smoke-test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: |
            modules/browser-tests/build/reports/browser-smoke
            modules/browser-tests/build/reports/browser-smoke-wasm
          if-no-files-found: ignore

      - name: Upload rollout metrics
        uses: actions/upload-artifact@v4
        with:
          name: browser-rollout-metrics
          path: modules/browser-tests/build/reports/browser-smoke*/metrics.properties
          if-no-files-found: error
