import org.teavm.gradle.api.OptimizationLevel
import org.teavm.gradle.api.SourceFilePolicy
import java.nio.file.Files
import java.util.zip.GZIPOutputStream

plugins {
    id 'mazegame.java-conventions'
    id 'mazegame.quality-conventions'
    id 'mazegame.coverage-conventions'
    alias(libs.plugins.gdx.teavm)
}

description = 'TeaVM browser launcher for Maze Game.'

def webAssetsDirectory = layout.buildDirectory.dir('generated/web-assets')
def prepareWebAssets = tasks.register('prepareWebAssets', Sync) {
    from(rootProject.file('assets')) {
        include 'mouse-sprites.png'
        include 'audio/exploreMaze_T1.mp3'
    }
    into webAssetsDirectory
}

def cleanWebOutput = tasks.register('cleanWebOutput', Delete) {
    delete layout.buildDirectory.dir('dist/js/webapp')
}
def webApplicationDirectory = layout.buildDirectory.dir('dist/js/webapp')
def webShellDirectory = layout.projectDirectory.dir('src/main/webapp')
def webArtifactReport = layout.buildDirectory.file('reports/web-artifact/manifest.txt')
def maximumUncompressedBytes = 6_500_000L
def maximumCompressedBytes = 4_500_000L

dependencies {
    implementation project(':modules:core')
    compileOnly libs.jetbrains.annotations
    testCompileOnly libs.jetbrains.annotations
}

// The TeaVM process entry point and its WebApplication error adapter require a browser.
def coverageExclusions = ['**/TeaVMLauncher*.class']

tasks.named('jacocoTestReport') {
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        exclude coverageExclusions
    })
}

tasks.named('jacocoTestCoverageVerification') {
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        exclude coverageExclusions
    })
}

configurations.named('annotationProcessor') {
    exclude group: 'org.teavm', module: 'teavm-extension-annotation-processor'
}

tasks.matching { task ->
    task.name == 'generateJavaScript' || task.name.startsWith('gdx_teavm_web_')
}.configureEach {
    notCompatibleWithConfigurationCache(
            'gdx-teavm 1.6.1 captures a Gradle task logger in its JavaScript generation task.'
            )
}

tasks.named('generateJavaScript') {
    dependsOn cleanWebOutput
    dependsOn prepareWebAssets
}

def installWebShell = tasks.register('installWebShell', Copy) {
    dependsOn tasks.named('generateJavaScript')
    from webShellDirectory
    into webApplicationDirectory
}

def pruneWebArtifact = tasks.register('pruneWebArtifact', Delete) {
    dependsOn tasks.named('gdx_teavm_web_js_build')
    dependsOn installWebShell
    delete webApplicationDirectory.map { directory -> directory.dir('WEB-INF') }
    delete fileTree(webApplicationDirectory) {
        include '**/*.map'
        include '**/*.java'
        include '**/*.class'
        include '**/*.xcf'
        include '**/*.psd'
        include '**/*.aseprite'
    }
}

tasks.matching { task -> task.name == 'gdx_teavm_web_js_run' }.configureEach {
    dependsOn installWebShell
}

def verifyWebArtifact = tasks.register('verifyWebArtifact') {
    group = 'verification'
    description = 'Verifies and records the production static-site artifact and size budgets.'
    dependsOn pruneWebArtifact
    inputs.dir webApplicationDirectory
    outputs.file webArtifactReport
    doLast {
        def root = webApplicationDirectory.get().asFile.toPath()
        def files = []
        def paths = Files.walk(root)
        try {
            paths.forEach { path ->
                if (Files.isSymbolicLink(path)) {
                    throw new GradleException("Web artifact contains symbolic link: ${root.relativize(path)}")
                }
                if (Files.isRegularFile(path)) {
                    files.add(path)
                }
            }
        } finally {
            paths.close()
        }
        files.sort { left, right -> root.relativize(left).toString() <=> root.relativize(right).toString() }
        long uncompressedBytes = 0L
        long compressedBytes = 0L
        def reportLines = []
        files.each { path ->
            long fileBytes = Files.size(path)
            def compressed = new ByteArrayOutputStream()
            new GZIPOutputStream(compressed).withCloseable { gzip ->
                Files.copy(path, gzip)
            }
            long gzipBytes = compressed.size()
            uncompressedBytes += fileBytes
            compressedBytes += gzipBytes
            reportLines.add("${root.relativize(path)}\t${fileBytes}\t${gzipBytes}")
        }
        reportLines.add(0, 'path\tbytes\tgzip-bytes')
        reportLines.add("TOTAL\t${uncompressedBytes}\t${compressedBytes}")
        reportLines.add("BUDGET\t${maximumUncompressedBytes}\t${maximumCompressedBytes}")
        def report = webArtifactReport.get().asFile
        report.parentFile.mkdirs()
        report.text = reportLines.join(System.lineSeparator()) + System.lineSeparator()
        if (uncompressedBytes > maximumUncompressedBytes || compressedBytes > maximumCompressedBytes) {
            throw new GradleException(
            "Web artifact exceeds size budget; see ${report.absolutePath}"
            )
        }
    }
}

tasks.register('assembleWebSite') {
    group = 'build'
    description = 'Assembles and verifies the release-quality static website.'
    dependsOn verifyWebArtifact
}

gdxTeaVM {
    assets.from(webAssetsDirectory)

    js {
        mainClass.set('io.github.sportne.mazegame.teavm.TeaVMLauncher')
        htmlTitle.set('Maze Game')
        htmlWidth.set(1280)
        htmlHeight.set(720)
        targetFileName.set('app.js')
        def developmentRequested = gradle.startParameter.taskNames.any { taskName ->
            taskName == 'webRun' || taskName.endsWith(':webRun') ||
                    taskName.endsWith('gdx_teavm_web_js_run')
        }
        optimization.set(developmentRequested ? OptimizationLevel.NONE : OptimizationLevel.AGGRESSIVE)
        obfuscated.set(!developmentRequested)
        debugInformation.set(developmentRequested)
        sourceMap.set(developmentRequested)
        sourceFilePolicy.set(
                developmentRequested ? SourceFilePolicy.COPY : SourceFilePolicy.DO_NOTHING
                )
        devServer {
            enabled.set(true)
            autoBuild.set(true)
            autoReload.set(true)
        }
    }
}
