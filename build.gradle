plugins {
    id 'base'
    id 'mazegame.pmd-conventions'
}

group = 'io.github.sportne'
version = providers.gradleProperty('mazeGame.version').getOrElse('0.1.0-SNAPSHOT')

def checkedProjects = [
    ':modules:core',
    ':modules:lwjgl3',
    ':modules:teavm',
    ':modules:architecture-tests',
    ':modules:browser-tests',
]

tasks.register('checkAll') {
    group = 'verification'
    description = 'Runs check tasks across all Maze Game modules.'
    dependsOn checkedProjects.collect { "${it}:check" }
}

tasks.register('qualityGate') {
    group = 'verification'
    description = 'Runs the default local quality gate.'
    dependsOn tasks.named('checkAll')
    dependsOn checkedProjects.collect { "${it}:spotlessCheck" }
    dependsOn tasks.named('pmdCheck')
    dependsOn tasks.named('cpdCheck')
    dependsOn tasks.named('webFormatCheck')
    dependsOn tasks.named('webMarkupCheck')
    dependsOn tasks.named('webStyleCheck')
}

def webToolSources = files(
    'modules/teavm/src/main/webapp/index.html',
    'modules/teavm/src/main/webapp/styles.css',
    'modules/teavm/src/main/webapp/favicon.svg',
    'modules/teavm/src/main/wasm/index.html',
)
def npmInstall = tasks.register('npmInstall', Exec) {
    group = 'build setup'
    description = 'Installs pinned web quality tools from package-lock.json.'
    inputs.files 'package.json', 'package-lock.json'
    outputs.file 'node_modules/.package-lock.json'
    commandLine 'npm', 'ci', '--ignore-scripts', '--no-audit', '--no-fund'
}

tasks.register('webFormatApply', Exec) {
    group = 'formatting'
    description = 'Formats maintained HTML, CSS, and SVG web-shell files.'
    dependsOn npmInstall
    inputs.files webToolSources
    commandLine 'npm', 'run', 'format:web'
}

tasks.register('webFormatCheck', Exec) {
    group = 'verification'
    description = 'Checks maintained web-shell formatting with pinned Prettier.'
    dependsOn npmInstall
    inputs.files webToolSources
    commandLine 'npm', 'run', 'check:format:web'
}

tasks.register('webMarkupCheck', Exec) {
    group = 'verification'
    description = 'Validates maintained HTML with pinned html-validate.'
    dependsOn npmInstall
    inputs.files 'modules/teavm/src/main/webapp/index.html',
            'modules/teavm/src/main/wasm/index.html', '.htmlvalidate.json'
    commandLine 'npm', 'run', 'lint:html'
}

tasks.register('webStyleCheck', Exec) {
    group = 'verification'
    description = 'Lints maintained CSS with pinned Stylelint.'
    dependsOn npmInstall
    inputs.files 'modules/teavm/src/main/webapp/styles.css', '.stylelintrc.json'
    commandLine 'npm', 'run', 'lint:css'
}

tasks.register('spotlessApply') {
    group = 'formatting'
    description = 'Applies repository formatting, including maintained web-shell files.'
    dependsOn tasks.named('webFormatApply')
}

tasks.register('nativeImage') {
    group = 'build'
    description = 'Builds the GraalVM Native Image desktop executable.'
    dependsOn ':modules:lwjgl3:nativeCompile'
}

tasks.register('nativeRun') {
    group = 'application'
    description = 'Runs the GraalVM Native Image desktop executable.'
    dependsOn ':modules:lwjgl3:nativeRun'
}

tasks.register('webBuild') {
    group = 'build'
    description = 'Builds the optimized TeaVM JavaScript web application.'
    dependsOn ':modules:teavm:assembleWebSite'
}

tasks.register('webRun') {
    group = 'application'
    description = 'Runs the TeaVM JavaScript development server.'
    dependsOn ':modules:teavm:gdx_teavm_web_js_run'
}

tasks.register('webWasmBuild') {
    group = 'build'
    description = 'Builds the optimized TeaVM WebAssembly preview.'
    dependsOn ':modules:teavm:assembleWasmSite'
}

tasks.register('webWasmRun') {
    group = 'application'
    description = 'Runs the TeaVM WebAssembly development server.'
    dependsOn ':modules:teavm:gdx_teavm_web_wasm_run'
}

tasks.register('browserSmokeTest') {
    group = 'verification'
    description = 'Runs browser smoke tests against the optimized TeaVM web application.'
    dependsOn ':modules:browser-tests:test'
}
